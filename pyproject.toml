[project]
name = "sharp"
version = "0.1"
description = "Inference/Network/Model code for SHARP view synthesis model."
readme = "README.md"
dependencies = [
  "av",
  "click",
  "gsplat",
  "h5py",
  "imageio[ffmpeg]",
  "matplotlib",
  "pillow-heif",
  "plyfile",
  "scipy",
  "timm",
  "torch",
  "torchvision",
]

[project.scripts]
sharp = "sharp.cli:main_cli"
sharp-spatialize = "sharp_spatialize.cli:generate_cli"
sharp-spatialize-validate = "sharp_spatialize.cli:validate_cli"
sharp-spatialize-webui = "sharp_spatialize.webui.server:main"
sharp_video_to_miv = "sharp_video.cli:video_to_miv_cli"
sharp-video-validate = "sharp_video.cli:validate_sequence_cli"
sharp-video-inspect = "sharp_video.cli:inspect_cli"
sharp-miv-encode = "sharp_video.cli:miv_encode_cli"
sharp-miv-validate = "sharp_video.cli:miv_validate_cli"
sharp-video-webui = "sharp_video.webui.server:main"

[project.urls]
Homepage = "https://github.com/apple/ml-sharp"
Repository = "https://github.com/apple/ml-sharp"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sharp_spatialize.webui" = ["static/*"]
"sharp_video.webui" = ["static/*"]

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
pythonVersion = "3.13"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
# Keep tmp dirs only for failed tests: test_load_predictor_checkpoint_path_branch
# writes a multi-GB checkpoint, which fills a tmpfs /tmp (e.g. WSL2) within a few runs.
tmp_path_retention_policy = "failed"
testpaths = [
    "tests"
]
markers = [
    "slow: runs real TMIV/CUDA tools; seconds to minutes",
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.lint.per-file-ignores]
"__init__.py" = ["F401", "D100", "D104"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "D", "I"]
lint.ignore = ["D100", "D105",
  # Imperative mood of docstring.
  "D401",
]
extend-exclude = [
    "*external*",
    "third_party",
]
src = ["sharp"]
target-version = "py39"

[tool.ruff.lint.pydocstyle]
convention = "google"
